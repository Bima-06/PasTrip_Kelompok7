<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Semua Destinasi | PasTrip</title>
<meta name="description" content="Bandingkan biaya perkiraan, fasilitas, dan akses sebelum berangkat. Filter berdasarkan harga tiket, kategori, dan fasilitas.">
</head>
<body>
<a class="skip-link" href="#isi">Langsung ke konten</a>
<header id="header"></header>
<main id="isi">
  <div class="judul-halaman">
    <div class="container">
      <nav class="crumb" aria-label="Breadcrumb"><a href="index.html">Beranda</a> / <span aria-current="page">Destinasi</span></nav>
      <h1>Semua Destinasi</h1>
      <p class="mb-0 text-secondary">Bandingkan biaya perkiraan, fasilitas, dan akses sebelum berangkat.</p>
      <form class="cari-box" id="form-cari" role="search">
        <span class="ikon" id="cari-ikon"></span>
        <input type="search" id="q" aria-label="Cari berdasarkan nama destinasi atau lokasi" placeholder="Cari berdasarkan nama destinasi atau lokasi..." autocomplete="off">
      </form>
    </div>
  </div>

  <div class="container py-4">
    <noscript><p>Aktifkan JavaScript untuk melihat daftar destinasi.</p></noscript>
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="offcanvas-lg offcanvas-bottom panel-filter" tabindex="-1" id="panel-filter" aria-labelledby="judul-filter">
          <div class="offcanvas-header d-lg-none pb-0">
            <span class="visually-hidden">Panel filter</span>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#panel-filter" aria-label="Tutup filter"></button>
          </div>
          <div class="offcanvas-body isi d-block">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h2 id="judul-filter">Filter</h2>
              <button type="button" class="btn-reset" id="btn-reset">Reset</button>
            </div>
            <form id="form-filter">
              <div class="grup-filter" role="group" aria-labelledby="g-harga"><h3 id="g-harga">Rentang Harga Tiket</h3><div id="filter-harga"></div></div>
              <div class="grup-filter" role="group" aria-labelledby="g-kat"><h3 id="g-kat">Kategori Wisata</h3><div id="filter-kat"></div></div>
              <div class="grup-filter" role="group" aria-labelledby="g-fas"><h3 id="g-fas">Fasilitas Tersedia</h3><div id="filter-fas"></div></div>
              <button type="submit" class="btn btn-pt w-100 mt-3">Terapkan Filter</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-9">
        <div class="bar-hasil">
          <p class="info mb-0" id="hasil-info" aria-live="polite"></p>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-pt btn-sm d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#panel-filter" aria-controls="panel-filter">Filter</button>
            <label class="visually-hidden" for="urut">Urutkan</label>
            <select class="form-select form-select-sm" id="urut">
              <option value="populer">Urutkan: Terpopuler</option>
              <option value="rating">Urutkan: Rating tertinggi</option>
              <option value="tiket">Urutkan: Tiket termurah</option>
              <option value="total">Urutkan: Total biaya terendah</option>
            </select>
          </div>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" id="daftar"></div>
        <div id="paging"></div>
      </div>
    </div>
  </div>
</main>
<footer class="footer" id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/destinasi.js" defer></script>
</body>
</html>
